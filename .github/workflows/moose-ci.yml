name: MooseCI

on: pull_request

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: moosetechnology/setup-MooseCI@v2.1.0
        with:
          project-path: ./src/main/java/fr/inria/corese/core/next
          project-language: java
